
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tetris Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* Glassmorphism Handheld Console */
        .glass-console {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            border-top: 1.5px solid rgba(255, 255, 255, 0.35);
            border-left: 1.5px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 0 25px rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            max-width: 325px;
            position: relative;
            transition: all 0.3s ease;
        }

        .glass-console::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 65%);
            border-radius: 20px 20px 0 0;
            pointer-events: none;
        }

        /* Screen Wrapper (Sharp Corners) */
        .screen-container {
            background: #04060a;
            border-radius: 0px;
            padding: 0;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        /* CRT Scanlines - Dynamic Overlay (only active when scanlines class is present) */
        .screen-container.scanlines::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        canvas {
            display: block;
            background-color: #04060a;
            border-radius: 0px;
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: fill;
        }

        /* Action Buttons (A/B) - Equal Size, Modern Tactile Glow */
        .btn-action-a {
            background: linear-gradient(145deg, #181920, #0c0d10);
            border: 1.5px solid rgba(6, 182, 212, 0.5);
            box-shadow: 
                0 0 14px rgba(6, 182, 212, 0.35),
                0 5px 12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action-a:active {
            transform: translateY(3px) scale(0.91);
            box-shadow: 
                0 0 24px rgba(6, 182, 212, 0.9),
                0 1px 2px rgba(0, 0, 0, 0.9),
                inset 0 4px 8px rgba(0, 0, 0, 0.95);
            border-color: #38bdf8;
            color: #ffffff;
        }

        .btn-action-b {
            background: linear-gradient(145deg, #181920, #0c0d10);
            border: 1.5px solid rgba(217, 70, 239, 0.5);
            box-shadow: 
                0 0 14px rgba(217, 70, 239, 0.35),
                0 5px 12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
            color: #f0abfc;
            text-shadow: 0 0 8px rgba(240, 171, 252, 0.8);
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action-b:active {
            transform: translateY(3px) scale(0.91);
            box-shadow: 
                0 0 24px rgba(217, 70, 239, 0.9),
                0 1px 2px rgba(0, 0, 0, 0.9),
                inset 0 4px 8px rgba(0, 0, 0, 0.95);
            border-color: #f0abfc;
            color: #ffffff;
        }

        /* D-Pad Container & Integrated Cross Pad */
        .dpad {
            position: relative;
            width: 124px;
            height: 124px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            padding: 2px;
        }
        .dpad-btn {
            position: absolute;
            background: linear-gradient(145deg, #1a1c23, #0f1015);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 0 8px rgba(255, 255, 255, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
            font-size: 13px;
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad-btn:active {
            background: #252834 !important;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.95), inset 0 4px 8px rgba(0, 0, 0, 0.95) !important;
            transform: translateY(3px) scale(0.92) !important;
            color: #38bdf8 !important;
        }
        .dpad-up { top: 2px; left: 42px; width: 40px; height: 44px; border-radius: 12px 12px 4px 4px; border-bottom: none; }
        .dpad-right { top: 42px; right: 2px; width: 44px; height: 40px; border-radius: 4px 12px 12px 4px; border-left: none; }
        .dpad-down { bottom: 2px; left: 42px; width: 40px; height: 44px; border-radius: 4px 4px 12px 12px; border-top: none; }
        .dpad-left { top: 42px; left: 2px; width: 44px; height: 40px; border-radius: 12px 4px 4px 12px; border-right: none; }
        .dpad-center { 
            top: 42px; left: 42px; width: 40px; height: 40px; 
            background: #14151a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
            border-radius: 4px;
            position: absolute;
        }

        /* Modal Custom Glassmorphism */
        .modal-glass {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        input[type=range] {
            accent-color: #38bdf8;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-3">

    <!-- Top Gear Icon Button for Settings Modal -->
    <button id="openSettingsBtn" class="fixed top-4 right-4 p-3 rounded-full bg-slate-800/70 border border-slate-600/50 hover:bg-slate-700/80 text-white shadow-xl transition transform hover:rotate-45 active:scale-90 z-30" title="Custom Settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>

    <!-- Glassmorphism Console Body -->
    <div class="glass-console flex flex-col items-center">

        <!-- Canvas Screen Area (Portrait Ratio) -->
        <div class="screen-container scanlines w-full mb-4">
            <div class="relative flex items-center justify-center">
                <canvas id="tetrisCanvas" width="240" height="480"></canvas>
                
                <!-- Start / Game Over Overlay -->
                <div id="overlayScreen" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center text-center p-4 rounded-none cursor-pointer transition-opacity duration-300 z-10">
                    <h2 id="overlayTitle" class="text-2xl font-black text-cyan-400 tracking-wider mb-2 drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]">TETRIS</h2>
                    <p id="overlayDesc" class="text-xs text-slate-300 mb-4 leading-relaxed">Ketuk Layar<br>untuk Memulai</p>
                    <span class="text-[10px] text-cyan-300/80 animate-bounce tracking-widest font-mono">[ START GAME ]</span>
                </div>
            </div>
        </div>

        <!-- Physical Gameboy Controls -->
        <div class="w-full flex justify-between items-center px-1 mt-1">
            
            <!-- D-Pad (Left) -->
            <div class="dpad" id="dpadContainer">
                <button class="dpad-btn dpad-up" data-action="up" aria-label="Rotate CW">▲</button>
                <button class="dpad-btn dpad-right" data-action="right" aria-label="Right">▶</button>
                <button class="dpad-btn dpad-down" data-action="down" aria-label="Soft Drop">▼</button>
                <button class="dpad-btn dpad-left" data-action="left" aria-label="Left">◀</button>
                <div class="dpad-center"></div>
            </div>

            <!-- Action Buttons A & B (Right - Equal Size) -->
            <div class="flex flex-col gap-3 items-center mr-1">
                <button id="btnA" class="btn-action-a w-12 h-12 rounded-full font-black text-base tracking-wider relative overflow-hidden flex items-center justify-center select-none" data-action="a" title="Hard Drop">
                    A
                </button>
                <button id="btnB" class="btn-action-b w-12 h-12 rounded-full font-black text-base tracking-wider relative overflow-hidden flex items-center justify-center select-none" data-action="b" title="Rotate">
                    B
                </button>
            </div>

        </div>
    </div>

    <!-- Custom Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div class="modal-glass w-full max-w-sm rounded-2xl p-6 shadow-2xl transform scale-95 transition-all duration-300" id="modalContent">
            
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-base font-bold text-white tracking-wide">Pengaturan Tetris</h3>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Preview Warna -->
            <div class="mb-5 flex items-center justify-between bg-slate-900/60 p-3.5 rounded-xl border border-white/5">
                <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Preview Warna</span>
                <div id="colorPreviewBox" class="w-20 h-7 rounded-lg border border-white/30 shadow-md transition-all duration-200" style="background-color: #0f172a;"></div>
            </div>

            <!-- Style Blok Tetris Selector -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Style Blok Tetris</label>
                <div class="grid grid-cols-2 gap-2" id="blockThemeSelector">
                    <button class="block-theme-btn active py-2.5 px-2 text-xs font-bold rounded-xl border border-cyan-400 bg-cyan-500/20 text-cyan-300 transition" data-theme="retro">Retro 3D</button>
                    <button class="block-theme-btn py-2.5 px-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/60 text-slate-300 transition hover:bg-slate-700/60" data-theme="modern">Modern</button>
                    <button class="block-theme-btn py-2.5 px-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/60 text-slate-300 transition hover:bg-slate-700/60" data-theme="neon">Neon Cyber</button>
                    <button class="block-theme-btn py-2.5 px-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/60 text-slate-300 transition hover:bg-slate-700/60" data-theme="flat">Hitam Putih</button>
                </div>
            </div>

            <!-- Presets Background Terang Section -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Preset Warna Background</label>
                <div class="grid grid-cols-5 gap-2">
                    <button class="preset-btn w-full h-10 rounded-xl border border-white/20 bg-[#ec4899] shadow-md transition hover:scale-105" data-color="#ec4899" data-h="330" data-s="81" data-l="60" title="Hot Pink"></button>
                    <button class="preset-btn w-full h-10 rounded-xl border border-white/20 bg-[#06b6d4] shadow-md transition hover:scale-105" data-color="#06b6d4" data-h="188" data-s="94" data-l="43" title="Bright Turquoise"></button>
                    <button class="preset-btn w-full h-10 rounded-xl border border-white/20 bg-[#8b5cf6] shadow-md transition hover:scale-105" data-color="#8b5cf6" data-h="258" data-s="90" data-l="66" title="Electric Violet"></button>
                    <button class="preset-btn w-full h-10 rounded-xl border border-white/20 bg-[#f97316] shadow-md transition hover:scale-105" data-color="#f97316" data-h="24" data-s="95" data-l="53" title="Sunset Orange"></button>
                    <button class="preset-btn w-full h-10 rounded-xl border border-white/20 bg-[#10b981] shadow-md transition hover:scale-105" data-color="#10b981" data-h="160" data-s="84" data-l="39" title="Bright Emerald"></button>
                </div>
            </div>

            <!-- Custom HSL Mixer Section -->
            <div class="space-y-3 mb-6 bg-slate-900/40 p-3.5 rounded-xl border border-white/5">
                <div>
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Hue (Warna)</span>
                        <span id="hueVal" class="font-mono text-cyan-400">222</span>
                    </div>
                    <input type="range" id="rangeHue" min="0" max="360" value="222" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Saturation (Pekat)</span>
                        <span id="satVal" class="font-mono text-cyan-400">47%</span>
                    </div>
                    <input type="range" id="rangeSat" min="0" max="100" value="47" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Lightness (Terang)</span>
                        <span id="lightVal" class="font-mono text-cyan-400">11%</span>
                    </div>
                    <input type="range" id="rangeLight" min="0" max="100" value="11" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <button id="saveSettingsBtn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
                Selesai
            </button>

        </div>
    </div>

    <!-- Game Engine Script -->
    <script>
        // Web Audio Synthesizer for SFX
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'rotate') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'drop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'harddrop') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'clear') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const subOsc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    subOsc.connect(subGain);
                    subGain.connect(audioCtx.destination);
                    subOsc.type = 'sine';
                    subOsc.frequency.setValueAtTime(freq, now + idx * 0.04);
                    subGain.gain.setValueAtTime(0.08, now + idx * 0.04);
                    subGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.04 + 0.12);
                    subOsc.start(now + idx * 0.04);
                    subOsc.stop(now + idx * 0.04 + 0.12);
                });
            } else if (type === 'gameover') {
                [260, 220, 180, 140].forEach((freq, idx) => {
                    const s
